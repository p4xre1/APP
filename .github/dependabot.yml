version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      capacitor:
        patterns:
          - '@capacitor/*'
      tools:
        patterns:
          - vite
          - '@vitejs/*'
          - typescript
          - tailwindcss
          - '@tailwindcss/*'
    ignore:
      # Capacitor majors are a coordinated upgrade (native project + plugins).
      - dependency-name: '@capacitor/*'
        update-types: ['version-update:semver-major']
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: gradle
    directory: /android
    schedule:
      interval: monthly
