name: Build Android APK - Fatorati Offline

on:
  push:
    branches: [arena/01a0edf7-app, main]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.34.3

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build web (offline production)
        run: pnpm build

      - name: Sync Capacitor Android
        run: pnpm cap:sync android

      - name: Build Debug APK
        run: |
          cd android
          chmod +x gradlew
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          cat local.properties
          echo "ANDROID_HOME=$ANDROID_HOME"
          java -version
          ls -lh gradle/wrapper/
          cat gradle/wrapper/gradle-wrapper.properties
          echo "Building APK..."
          ./gradlew assembleDebug --no-daemon --stacktrace 2>&1 | tee ../gradle.log
          echo "Exit code: ${PIPESTATUS[0]}"
          echo "=== Finding APKs ==="
          find . -type f -name "*.apk" | xargs ls -lh 2>&1 || echo "No APK found"
          ls -lhR app/build/outputs/ 2>&1 | head -n 100 || echo "No outputs"
          echo "=== Copying APK ==="
          mkdir -p ../artifacts
          find app/build -name "*.apk" -type f -exec cp -v {} ../artifacts/ \; || echo "No APK to copy"
          ls -lh ../artifacts/ || true
          ls -lh app/build/outputs/apk/debug/ || true

      - name: Upload gradle logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-logs
          path: gradle.log
          retention-days: 7

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: fatorati-offline-apk
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            artifacts/
          retention-days: 30
          if-no-files-found: error
