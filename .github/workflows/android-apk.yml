name: Build Android APK - Fatorati Offline

on:
  push:
    branches: [arena/01a0edf7-app, main]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.34.3

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install dependencies
        run: |
          for i in 1 2 3; do
            echo "Install attempt $i"
            pnpm install --frozen-lockfile && break
            echo "Failed attempt $i"
            if [ $i -eq 3 ]; then exit 1; fi
            sleep 5
          done

      - name: Build web (offline production)
        run: pnpm build

      - name: Sync Capacitor Android
        run: pnpm cap:sync android

      - name: Build Debug APK
        run: |
          cd android
          chmod +x gradlew
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          echo "Building APK..."
          ./gradlew assembleDebug --no-daemon --stacktrace
          echo "APK outputs:"
          ls -lh app/build/outputs/apk/debug/ || true
          find app/build -name "*.apk" -type f -exec ls -lh {} \; || echo "No APK found"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: fatorati-offline-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
