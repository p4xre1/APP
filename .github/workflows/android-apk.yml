name: Build Android APK

on:
  push:
    branches: [main, 'arena/**']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v6
      - uses: android-actions/setup-android@v4

      - run: pnpm install --frozen-lockfile
      - run: pnpm exec tsc --noEmit
      - run: pnpm test
      # High and critical advisories fail the build; the lockfile is the source of truth.
      - run: pnpm audit --audit-level high
      - run: pnpm build
      - run: pnpm cap:sync android

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          ./gradlew assembleDebug --no-daemon --stacktrace

      # The plugin manifest declares SCHEDULE_EXACT_ALARM; the app removes it with
      # tools:node="remove" because reminders are deliberately inexact. This checks
      # what the Android manifest merger actually produced.
      - name: Verify the merged Android manifest
        working-directory: android
        run: |
          set -euo pipefail
          manifest=$(find app/build/intermediates -name AndroidManifest.xml -path '*merged_manifest*' | head -1)
          while [ -z "$manifest" ]; do
            manifest=$(find app/build/intermediates -name AndroidManifest.xml | head -1)
            break
          done
          echo "merged manifest: $manifest"
          test -s "$manifest"
          grep -q 'POST_NOTIFICATIONS' "$manifest"
          if grep -qE 'SCHEDULE_EXACT_ALARM|USE_EXACT_ALARM' "$manifest"; then
            echo '::error::exact-alarm permission leaked into the merged manifest'
            exit 1
          fi
          if grep -q 'android.permission.INTERNET' "$manifest"; then
            echo '::error::INTERNET permission leaked into the merged manifest'
            exit 1
          fi

      # R8/minify/shrinkResources only run in release, so this catches keep-rule
      # regressions before a signed build. The APK is unsigned and not published.
      - name: Verify the release build compiles (R8, unsigned)
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - uses: actions/upload-artifact@v7
        with:
          name: fatorati-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
